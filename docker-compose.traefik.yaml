name: formbricks
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: formbricks/formbricks:latest
    container_name: formbricks-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      WEBAPP_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      NEXTAUTH_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      DATABASE_URL: postgresql://${DB_USER_NAME:-formbricks}:${DB_USER_PASS:-replace-with-a-random-password}@formbricks-db:5432/${DB_CREATE_DATABASE_NAME:-formbricks}
      NEXTAUTH_SECRET: ${APP_SECRET_KEY:-replace-with-a-random-password}
      ENCRYPTION_KEY: ${APP_SECRET_TOKEN_64:-replace-with-a-random-password}
      CRON_SECRET: ${SECURE_SECRET:-replace-with-a-random-password}
      REDIS_URL: redis://formbricks-redis:6379
      MAIL_FROM: ${EMAIL_SERVER_MAIL_FROM:-noreply@example.com}
      SMTP_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      SMTP_USER: ${EMAIL_SERVER_LOGIN_NAME:-}
      SMTP_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      SMTP_SECURE_ENABLED: "0"
      CONTAINER_NAME: formbricks-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/data/formbricks:/app/uploads'
    depends_on:
      formbricks-db:
        condition: service_healthy
      formbricks-redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.formbricks-app.entrypoints=http'
      - 'traefik.http.routers.formbricks-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.formbricks-app.middlewares=formbricks-app-https-redirect'
      - 'traefik.http.middlewares.formbricks-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.formbricks-app-secure.entrypoints=https'
      - 'traefik.http.routers.formbricks-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.formbricks-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.formbricks-app-secure.service=formbricks-app'
      - 'traefik.http.services.formbricks-app.loadbalancer.server.port=3000'
    networks:
      - formbricks
      - traefik

  formbricks-db:
    image: postgres:latest
    container_name: formbricks-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: formbricks-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-formbricks}
      POSTGRES_USER: ${DB_USER_NAME:-formbricks}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      CONTAINER_NAME: formbricks-db
    volumes:
      - './volumes/db/postgres/formbricks:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - formbricks

  formbricks-redis:
    image: redis:alpine
    container_name: formbricks-redis
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: formbricks-redis
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: formbricks-redis
    volumes:
      - './volumes/cache/redis/formbricks:/data:z'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - formbricks

networks:
  formbricks:
    name: formbricks
    external: false
  traefik:
    external: true
