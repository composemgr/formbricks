# nginx proxy address - http://172.17.0.1:8095

name: formbricks
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  formbricks:
    image: formbricks/formbricks:latest
    pull_policy: always
    container_name: formbricks-app
    restart: always
    logging: *default-logging
    networks:
      - formbricks
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:8095:3000"
    environment:
      TZ: ${TZ:-America/New_York}
      WEBAPP_URL: http://${BASE_HOST_NAME:-localhost}:8095
      DATABASE_URL: postgresql://${DB_USER_NAME:-formbricks}:${DB_USER_PASS:-changeme_db_password}@formbricks-db:5432/${DB_CREATE_DATABASE_NAME:-formbricks}
      NEXTAUTH_SECRET: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      NEXTAUTH_URL: http://${BASE_HOST_NAME:-localhost}:8095
      MAIL_FROM: ${EMAIL_SERVER_MAIL_FROM:-noreply@example.com}
      SMTP_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      SMTP_USER: ${EMAIL_SERVER_LOGIN_NAME:-}
      SMTP_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      SMTP_SECURE_ENABLED: "0"
      CONTAINER_NAME: formbricks-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - ./volumes/data/formbricks:/app/uploads
    depends_on:
      - formbricks-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://formbricks-app:3000'
      - 'cloudflare.hostname=formbricks.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.formbricks-app.entrypoints=http'
      - 'traefik.http.routers.formbricks-app-secure.tls=true'
      - 'traefik.http.routers.formbricks-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.formbricks-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.formbricks-app.middlewares=formbricks-app-https-redirect'
      - 'traefik.http.routers.formbricks-app-secure.entrypoints=https'
      - 'traefik.http.routers.formbricks-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.formbricks-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.formbricks-app-secure.service=formbricks-app'
      - 'traefik.http.services.formbricks-app.loadbalancer.server.port=3000'

  formbricks-db:
    image: postgres:latest
    pull_policy: always
    container_name: formbricks-db
    restart: always
    logging: *default-logging
    networks:
      - formbricks
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-formbricks}
      POSTGRES_USER: ${DB_USER_NAME:-formbricks}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      CONTAINER_NAME: formbricks-db
    volumes:
      - ./volumes/data/db/postgres/formbricks:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  formbricks:
    name: formbricks
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
